name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a release PR from Conventional Commits; on merge it tags the
  # version and creates the GitHub release with an auto-generated changelog.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs['.--release_created'] }}
      tag_name: ${{ steps.rp.outputs['.--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a release is cut, build the CLI natively per OS (CGO, no cross-compile)
  # and attach the archives + checksums to that release. Done in the same
  # workflow because GITHUB_TOKEN-created tags do not trigger other workflows.
  release-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ""
          - os: macos-latest
            goos: darwin
            ext: ""
          - os: windows-latest
            goos: windows
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install audio dev headers (Linux CGO)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        shell: bash
        working-directory: cli
        env:
          GOWORK: off
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/focus${{ matrix.ext }}" ./cmd/focus
      - name: Package and checksum
        shell: bash
        working-directory: cli
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          goarch="$(go env GOARCH)"
          base="focus_${VERSION}_${{ matrix.goos }}_${goarch}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${base}.zip" "focus${{ matrix.ext }}" >/dev/null
            archive="${base}.zip"
          else
            tar -czf "${base}.tar.gz" "focus${{ matrix.ext }}"
            archive="${base}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          echo "ARCHIVE=cli/dist/${archive}" >> "$GITHUB_ENV"
          echo "CHECKSUM=cli/dist/${archive}.sha256" >> "$GITHUB_ENV"
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
